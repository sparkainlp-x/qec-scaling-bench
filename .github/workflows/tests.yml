name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test]"
      - name: Metadata files parse
        run: |
          python -c "import json; json.load(open('.zenodo.json', encoding='utf-8'))"
          python -c "import json; json.load(open('results/scaling_sweep_seed_1823.json', encoding='utf-8'))"
      - name: Committed results match their checksums
        run: cd results && sha256sum -c SHA256SUMS
      - name: Tests
        run: python -m pytest
      - name: Full seed-1823 sweep reproduces the committed report (exactly, or statistically on a different SIMD path)
        run: |
          qec-scaling-bench --shots 20000 --seed 1823 --bootstrap 2000 \
            --output "$RUNNER_TEMP/fresh.json" --trials-csv "$RUNNER_TEMP/fresh.csv"
          python tools/compare_reports.py results/scaling_sweep_seed_1823.json "$RUNNER_TEMP/fresh.json"
          if cmp -s results/center_noise_trials_seed_1823.csv "$RUNNER_TEMP/fresh.csv"; then
            echo "trials CSV: byte-identical"
          else
            echo "trials CSV: differs (expected only if Stim used a different SIMD path; JSON check above is authoritative)"
          fi
